<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TypeDeck</title>
  <meta name="description" content="키와 값을 손으로 타이핑하며 외우는 카드 연습기">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>TypeDeck</span></div>
      <div class="deck-tools">
        <span>덱</span>
        <button class="link-btn keep-focus" id="toggleGroups" type="button"></button>
      </div>
      <nav class="deck-list" id="deckList" aria-label="덱 목록"></nav>
      <div class="sidebar-foot">
        <div class="foot-buttons">
          <button class="ghost-btn keep-focus" id="newCategory" type="button">＋ 새 카테고리</button>
          <button class="ghost-btn keep-focus" id="newDeck" type="button">＋ 새 덱</button>
        </div>
        <button class="link-btn keep-focus" id="restoreDecks" type="button">토익 단어장 추가</button>
        <span class="note" id="sidebarNote" role="status"></span>
      </div>
    </aside>

    <main class="stage">
      <header class="topbar">
        <div class="deck-title">
          <h1 id="deckName">TypeDeck</h1>
          <button class="ghost-btn small keep-focus" id="editDeck" type="button">편집</button>
        </div>
        <div class="controls">
          <div class="segmented" role="radiogroup" aria-label="연습 방식">
            <button class="keep-focus" type="button" role="radio" data-mode="copy">따라치기</button>
            <button class="keep-focus" type="button" role="radio" data-mode="recall">외워치기</button>
            <button class="keep-focus" type="button" role="radio" data-mode="choice">5지선다</button>
          </div>
          <button class="toggle keep-focus" type="button" id="reverseBtn" aria-pressed="false" title="키와 값의 방향을 바꿉니다">⇄ 뒤집기</button>
          <button class="toggle keep-focus" type="button" id="shuffleBtn" aria-pressed="true" title="카드 순서를 섞습니다">섞기</button>
        </div>
      </header>

      <section class="arena" id="arena">
        <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
        <div class="stack" id="stack"></div>
        <input class="sink" id="sink" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="정답 입력">
      </section>

      <footer class="statusbar">
        <dl class="stats" id="stats"></dl>
        <p class="hints" id="hints"></p>
      </footer>
    </main>
  </div>

  <dialog class="editor" id="editor">
    <div class="editor-inner">
      <div class="editor-head">
        <h2 id="editorTitle">덱 편집</h2>
        <div class="segmented small" id="editorView" role="radiogroup" aria-label="편집 방식">
          <button type="button" role="radio" data-view="rows">표</button>
          <button type="button" role="radio" data-view="text">텍스트</button>
        </div>
      </div>
      <div class="field-row">
        <label class="field">
          <span>카테고리</span>
          <input id="editorCategory" maxlength="40" autocomplete="off" list="categoryList" placeholder="예: 정보처리기사 (비우면 미분류)">
          <datalist id="categoryList"></datalist>
        </label>
        <label class="field grow">
          <span>이름</span>
          <input id="editorName" maxlength="60" autocomplete="off" placeholder="덱 이름">
        </label>
      </div>
      <div class="field">
        <div class="cards-head">
          <span>카드 <em id="editorCount">0장</em></span>
          <span class="cards-tip"><kbd>Enter</kbd>다음 칸 · 여러 줄 붙여넣기 가능</span>
          <button type="button" class="link-btn" id="editorImport" title="텍스트(키 = 값), CSV, TSV 파일의 카드를 넣습니다">파일에서 불러오기</button>
          <input type="file" id="editorFile" accept=".txt,.csv,.tsv,.md,text/plain,text/csv,text/tab-separated-values" hidden>
        </div>
        <div class="card-rows" id="editorRows">
          <div class="card-rows-header"><span></span><span>키</span><span>값 <small>여러 개면 쉼표로 구분</small></span><span></span></div>
          <div class="card-rows-body" id="rowsBody"></div>
          <div class="col-divider" id="colDivider" role="separator" aria-orientation="vertical" aria-label="키와 값 칸 너비 조절" tabindex="0" title="끌어서 키와 값 칸 너비 조절 · 두 번 클릭하면 처음대로"></div>
        </div>
        <textarea id="editorCards" rows="14" spellcheck="false" hidden placeholder="한 줄에 카드 하나: 키 = 값&#10;대한민국 = 서울&#10;404 = Not Found&#10;&#10;값이 여러 개면 쉼표로: apply = 지원하다, 신청하다&#10;탭, =, : 로 나눠도 됩니다. 스프레드시트 두 열을 그대로 붙여 넣어도 돼요."></textarea>
      </div>
      <p class="editor-note" id="editorNote" role="status"></p>
      <div class="editor-actions">
        <button type="button" class="danger-btn" id="editorDelete">덱 삭제</button>
        <span class="spacer"></span>
        <button type="button" class="ghost-btn" id="editorCancel">취소</button>
        <button type="button" class="primary-btn" id="editorSave">저장 <span class="shortcut">⌘↵</span></button>
      </div>
    </div>
  </dialog>

  <dialog class="editor picker" id="picker" aria-labelledby="pickerTitle">
    <div class="editor-inner">
      <div class="picker-hero">
        <img src="icon.svg" alt="" width="44" height="44">
        <div>
          <h2 id="pickerTitle"></h2>
          <p id="pickerLead"></p>
        </div>
      </div>
      <div class="picker-list" id="pickerList"></div>
      <div class="editor-actions">
        <span class="spacer"></span>
        <button type="button" class="ghost-btn" id="pickerSkip"></button>
        <button type="button" class="primary-btn" id="pickerOk"></button>
      </div>
    </div>
  </dialog>
</body>
</html>
